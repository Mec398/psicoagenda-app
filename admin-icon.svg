<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Anillo decorativo sutil -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#10B981" stroke-opacity="0.18" stroke-width="4" />

  <!-- Escudo principal -->
  <path
    d="M256 72 L404 128 V246 C404 344 338 416 256 446 C174 416 108 344 108 246 V128 Z"
    fill="url(#shieldGrad)"
  />

  <!-- Interior del escudo -->
  <path
    d="M256 96 L380 144 V244 C380 328 324 390 256 418 C188 390 132 328 132 244 V144 Z"
    fill="url(#innerGrad)"
  />

  <!-- Corona / Puntos de control superior -->
  <circle cx="256" cy="152" r="10" fill="#34D399" />
  <circle cx="212" cy="166" r="7" fill="#06B6D4" />
  <circle cx="300" cy="166" r="7" fill="#06B6D4" />

  <!-- Iniciales NM (NOVAMEC) -->
  <text
    x="256"
    y="282"
    text-anchor="middle"
    font-family="Segoe UI, Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="118"
    letter-spacing="-4"
    fill="#FFFFFF"
  >NM</text>

  <!-- Etiqueta ADMIN -->
  <rect x="176" y="308" width="160" height="40" rx="12" fill="url(#shieldGrad)" />
  <text
    x="256"
    y="335"
    text-anchor="middle"
    font-family="Segoe UI, Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="22"
    letter-spacing="3"
    fill="#06281E"
  >ADMIN</text>
</svg>
